<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="traffic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#63a8ff"/></marker>
    <marker id="service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f0a75f"/></marker>
    <marker id="ipv6-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ae8bff"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;text-anchor:middle;fill:#dce9e4}
      .title{font-size:15px;font-weight:700}.small{font-size:12px;font-weight:500;fill:#8fa39b}.micro{font-size:11px;font-weight:600;fill:#82978f}.module{font-size:12px;font-weight:650}.legend{font-size:11px;font-weight:600;fill:#8fa39b}.ipv6{fill:#b79aff}
    </style>
  </defs>
  <rect x="116" y="36" width="590" height="232" rx="24" fill="#0d1d18" stroke="#2d473d" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="micro" x="270" y="62">现有局域网 · Wi-Fi 或以太网</text>

  <g filter="url(#shadow)">
    <rect x="14" y="126" width="94" height="82" rx="18" fill="#0a1713" stroke="#304b40" stroke-width="1.25"/>
    <text class="title" x="61" y="160">Internet</text><text class="small" x="61" y="184">公网</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="154" y="105" width="132" height="124" rx="20" fill="#0a1713" stroke="#304b40" stroke-width="1.25"/>
    <text class="title" x="220" y="135">主路由 / AP</text>
    <path d="M184 153h72" stroke="#223930"/>
    <text class="small" x="220" y="174">DHCP 关闭</text><text class="small" x="220" y="195">LAN 地址保留</text>
    <text class="micro ipv6" x="220" y="216">IPv6：主路由 RA 关闭</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="326" y="78" width="190" height="176" rx="24" fill="#102a21" stroke="#63d5a4" stroke-width="1.75"/>
    <text class="title" x="421" y="110">Mac / OpenSurge</text>
    <rect x="346" y="129" width="150" height="52" rx="12" fill="#0d201a" stroke="#4dad83" stroke-width="1"/>
    <text class="module" x="421" y="151">DHCP + DNS</text><text class="micro ipv6" x="421" y="171">IPv6 RA / DNS</text>
    <rect x="346" y="190" width="150" height="47" rx="12" fill="#0d201a" stroke="#4dad83" stroke-width="1"/>
    <text class="module" x="421" y="209">规则与转发</text><text class="micro" x="421" y="228">IPv4 TUN · <tspan class="ipv6">IPv6 用户态</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="558" y="94" width="136" height="144" rx="22" fill="#251b12" stroke="#e3a163" stroke-width="1.5"/>
    <text class="title" x="626" y="128">局域网设备</text>
    <text class="small" x="626" y="153">手机 · 电视</text><text class="small" x="626" y="173">游戏机 · IoT</text>
    <text class="micro ipv6" x="626" y="193">IPv6 可选</text>
    <rect x="577" y="201" width="98" height="26" rx="13" fill="#1a1713" stroke="#704b2d"/>
    <text class="micro" x="626" y="219">自动获取设置</text>
  </g>

  <path d="M558 190H518" fill="none" stroke="#63a8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#traffic)"/>
  <path d="M326 190H288" fill="none" stroke="#63a8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#traffic)"/>
  <path d="M154 167H110" fill="none" stroke="#63a8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#traffic)"/>
  <path d="M496 151C526 119 544 119 558 137" fill="none" stroke="#f0a75f" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#service)"/>
  <path d="M496 173C526 154 544 155 558 169" fill="none" stroke="#ae8bff" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" marker-end="url(#ipv6-service)"/>
  <g>
    <rect x="488" y="77" width="151" height="28" rx="14" fill="#2c2115" stroke="#80552f"/>
    <circle cx="502" cy="91" r="3" fill="#f0a75f"/><text class="micro" x="516" y="95" style="text-anchor:start">自动下发 DHCP / DNS</text>
  </g>
  <g>
    <rect x="488" y="239" width="151" height="28" rx="14" fill="#211a2d" stroke="#67518f"/>
    <circle cx="502" cy="253" r="3" fill="#ae8bff"/><text class="micro ipv6" x="516" y="257" style="text-anchor:start">可选 IPv6 RA / DNS</text>
  </g>

  <g transform="translate(100 310)"><path d="M0 0h34" stroke="#63a8ff" stroke-width="4"/><text class="legend" x="86" y="5">设备上网路径</text></g>
  <g transform="translate(306 310)"><path d="M0 0h34" stroke="#f0a75f" stroke-width="3" stroke-dasharray="7 6"/><text class="legend" x="93" y="5">IPv4 DHCP / DNS</text></g>
  <g transform="translate(531 310)"><path d="M0 0h34" stroke="#ae8bff" stroke-width="2.5" stroke-dasharray="6 6"/><text class="legend" x="91" y="5">可选 IPv6 下发</text></g>
</svg>
