name: Unsigned macOS release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }} package
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x86_64
    env:
      OPENSURGE_APP_ARCH: ${{ matrix.arch }}
      OPENSURGE_RELEASE_ARCH: ${{ matrix.arch }}
      OPENSURGE_MINIMUM_MACOS: "13.0"
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag and source branch
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo "unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          package_version="${BASH_REMATCH[1]}"
          if [[ -n "${BASH_REMATCH[2]}" ]]; then
            source_branch="codex/release-v${package_version}"
            prerelease=true
          else
            source_branch=master
            prerelease=false
          fi

          git fetch origin "$source_branch" --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "release tag is not reachable from origin/$source_branch" >&2
            exit 1
          }
          echo "version=$package_version" >>"$GITHUB_OUTPUT"
          echo "release_tag=$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install Web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Prepare pinned runtime dependencies
        run: ./scripts/prepare-gui-release-deps.sh

      - name: Run GUI release checks
        env:
          GOCACHE: ${{ runner.temp }}/go-build-cache
        run: make gui-test

      - name: Build and verify unsigned installer
        id: package
        shell: bash
        env:
          GOCACHE: ${{ runner.temp }}/go-build-cache
          OPENSURGE_VERSION: ${{ steps.version.outputs.version }}
          OPENSURGE_BUILD_NUMBER: ${{ github.run_number }}
          OPENSURGE_RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          OPENSURGE_MIHOMO_BINARY: ${{ github.workspace }}/runtime/release-tools/bin/mihomo
          OPENSURGE_DNSMASQ_BINARY: ${{ github.workspace }}/runtime/release-tools/bin/dnsmasq
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          make gui-installer
          release_dir="$GITHUB_WORKSPACE/artifacts/release"
          release_pkg="$release_dir/OpenSurge-for-Mac-${OPENSURGE_VERSION}-${RELEASE_ARCH}-unsigned.pkg"
          mkdir -p "$release_dir"
          mv "$GITHUB_WORKSPACE/artifacts/gui-installer/OpenSurge-for-Mac-${OPENSURGE_VERSION}.pkg" "$release_pkg"
          ./scripts/verify-unsigned-gui-installer.sh \
            "$release_pkg" \
            "$OPENSURGE_VERSION" \
            "$RELEASE_ARCH" \
            "$OPENSURGE_MINIMUM_MACOS" \
            "$OPENSURGE_RELEASE_TAG"
          echo "pkg=$release_pkg" >>"$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.pkg }}

      - name: Preserve architecture package
        uses: actions/upload-artifact@v7
        with:
          name: OpenSurge-for-Mac-${{ steps.version.outputs.version }}-${{ env.RELEASE_ARCH }}-unsigned
          path: ${{ steps.package.outputs.pkg }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Download architecture packages
        uses: actions/download-artifact@v8
        with:
          pattern: OpenSurge-for-Mac-*-unsigned
          path: artifacts/release
          merge-multiple: true

      - name: Create combined checksums
        shell: bash
        run: |
          cd artifacts/release
          sha256sum OpenSurge-for-Mac-*-unsigned.pkg >SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="$GITHUB_WORKSPACE/artifacts/release"
          package_version="${GITHUB_REF_NAME#v}"
          package_version="${package_version%%-rc.*}"
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            channel_flag=--prerelease
          else
            channel_flag=--latest
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$release_dir/OpenSurge-for-Mac-${package_version}-arm64-unsigned.pkg#Apple Silicon 安装包 / Apple Silicon installer" \
            "$release_dir/OpenSurge-for-Mac-${package_version}-x86_64-unsigned.pkg#Intel 安装包 / Intel installer" \
            "$release_dir/SHA256SUMS#SHA-256 校验文件 / SHA-256 checksums" \
            --verify-tag \
            "$channel_flag" \
            --title "OpenSurge for Mac $GITHUB_REF_NAME" \
            --notes-file packaging/unsigned-release-notes.md
