name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global pnpm@11.19.0
      - run: pnpm --dir web install --frozen-lockfile
      - run: make web-test web-build

  desktop:
    name: Desktop build (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - name: Test desktop control client
        run: make desktop-test
      - name: Build native desktop preview
        env:
          OPENSURGE_DESKTOP_ARCH: ${{ matrix.arch }}
        run: make desktop-build
      - name: Build production desktop bundle
        env:
          OPENSURGE_APP_ARCH: ${{ matrix.arch }}
          OPENSURGE_VERSION: 0.2.4
          OPENSURGE_BUILD_NUMBER: 42
          OPENSURGE_RELEASE_TAG: v0.2.4-next
        run: ./scripts/build-desktop-app.sh production
